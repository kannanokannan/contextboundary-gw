apiVersion: contextboundary/v0
kind: BoundaryPolicy
metadata:
  name: P-STRICT
  description: Strict conformance fixture
  default_decision: deny
tiers:
  - id: T0
  - id: T1
  - id: T2
  - id: T3
egress_tiers:
  - id: I
  - id: II
  - id: III
egress_detectors:
  - id: det:credential-pattern
    description: Credential-shaped content
    match: credential-patterns
    min_tier: I
remediation:
  transforms:
    - id: strip_field
      path: [payload, legacy_credential]
    - id: redact_match
      path: [payload, note]
      pattern: '(password|credential|secret)\\s*[=:]\\s*[^\\s]+'
    - id: clamp_tier
      path: [payload_egress_tier]
      ceiling: I
  rules:
    - rule_id: R4
      reason: egress_violation
      detector_id: det:credential-pattern
      transforms: [strip_field, redact_match, clamp_tier]
  defer_rules:
    - id: wait-for-source-ready
      action_type: invoke
      capability: triage-alert
      when: { path: [payload, source_ready], equals: false }
      resume_condition: source-ready
      resume_path: [payload, source_ready]
identities:
  - id: agent:run-l1
    accountable_owner: role:run-lead-apac
    autonomy_tier: T1
    trusted_sources: [mcp:self]
    agent_keys:
      - key_id: agent:run-l1-ed25519-v1
        public_jwk: { kty: OKP, crv: Ed25519, x: 11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURA }
  - id: agent:run-l3
    accountable_owner: role:run-lead-apac
    autonomy_tier: T3
    trusted_sources: [mcp:self]
    agent_keys:
      - key_id: agent:run-l3-ed25519-v1
        public_jwk: { kty: OKP, crv: Ed25519, x: 11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURA }
  - id: agent:run-l3v
    accountable_owner: role:run-lead-apac
    autonomy_tier: T3
    trusted_sources: [mcp:self, mcp:vendor]
    agent_keys:
      - key_id: agent:run-l3v-ed25519-v1
        public_jwk: { kty: OKP, crv: Ed25519, x: 11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURA }
capabilities:
  - id: triage-alert
    source: mcp:self
    required_tier: T1
    discover_min_tier: T1
    egress_tier: II
    requires_approval: false
  - id: apply-change
    source: mcp:self
    required_tier: T3
    discover_min_tier: T2
    egress_tier: II
    requires_approval: true
  - id: read-secrets
    source: mcp:vendor
    required_tier: T3
    discover_min_tier: T3
    egress_tier: I
    requires_approval: true
endpoints:
  - id: primary
    continuity_class: export-exposed
    zone: II
    fallbacks: [secondary]
  - id: secondary
    continuity_class: domestic
    zone: II
    fallbacks: []
  - id: loose
    continuity_class: domestic
    zone: III
    fallbacks: []
  - id: primary-loose-only
    continuity_class: export-exposed
    zone: II
    fallbacks: [loose]
audit:
  emit:
    - agent_id
    - accountable_owner
    - tier_in_force
    - action
    - decision
    - rule_id
    - egress_tier_seen
    - detector_id
    - obligation
    - timestamp
  sink: analytics-engine
